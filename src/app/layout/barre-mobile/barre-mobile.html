@if (utilisateur()) {
  <div class="barre-mobile__espaceur" aria-hidden="true"></div>
  <nav class="cdt-tabbar" aria-label="Navigation du compte">
    <a class="cdt-tabbar__item" routerLink="/tableau-de-bord" routerLinkActive #tableau="routerLinkActive" [attr.aria-current]="tableau.isActive ? 'page' : null">
      <svg class="cdt-tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="9" rx="1.5" />
        <rect x="14" y="3" width="7" height="5" rx="1.5" />
        <rect x="14" y="12" width="7" height="9" rx="1.5" />
        <rect x="3" y="16" width="7" height="5" rx="1.5" />
      </svg>
      <span class="cdt-tabbar__label">Tableau de bord</span>
    </a>
    <a class="cdt-tabbar__item" routerLink="/maps" routerLinkActive #maps="routerLinkActive" [attr.aria-current]="maps.isActive ? 'page' : null">
      <svg class="cdt-tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z" />
        <path d="M9 4v13.5" />
        <path d="M15 6.5V20" />
      </svg>
      <span class="cdt-tabbar__label">Mes maps</span>
    </a>
    <a class="cdt-tabbar__item" routerLink="/compte" routerLinkActive #compte="routerLinkActive" [attr.aria-current]="compte.isActive ? 'page' : null">
      <svg class="cdt-tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
      </svg>
      <span class="cdt-tabbar__label">Compte</span>
    </a>
  </nav>
}
