<header class="header">
  <nav class="cdt-nav" aria-label="Navigation principale">
    <a class="cdt-nav__brand" routerLink="/">Celeste Death Tracker</a>
    <div class="cdt-row header__actions">
      <div class="cdt-nav__links">
        <a class="cdt-nav__link" routerLink="/mod" routerLinkActive #mod="routerLinkActive" [attr.aria-current]="mod.isActive ? 'page' : null">Le mod</a>
        <a class="cdt-nav__link" routerLink="/faq" routerLinkActive #faq="routerLinkActive" [attr.aria-current]="faq.isActive ? 'page' : null">FAQ</a>
        <!-- Même @if que le bloc du compte ci-dessous : lien réservé au joueur connecté, rangé avec
             les autres liens de navigation plutôt qu'avec les boutons. -->
        @if (utilisateur()) {
          <a class="cdt-nav__link" routerLink="/maps" routerLinkActive #maps="routerLinkActive" [attr.aria-current]="maps.isActive ? 'page' : null">Mes maps</a>
        }
      </div>
      @if (utilisateur()) {
        <span class="header__compte" [title]="nom()">{{ nom() }}</span>
        <a class="cdt-btn cdt-btn--primary cdt-btn--sm" routerLink="/tableau-de-bord">Tableau de bord</a>
        <button
          class="cdt-btn cdt-btn--ghost cdt-btn--sm"
          type="button"
          [attr.aria-busy]="deconnexionEnCours()"
          (click)="deconnecter()"
        >Se déconnecter</button>
      } @else if (surConnexion()) {
        <a class="cdt-btn cdt-btn--secondary cdt-btn--sm" routerLink="/inscription">Créer un compte</a>
      } @else {
        <a class="cdt-btn cdt-btn--primary cdt-btn--sm" routerLink="/login">Se connecter</a>
      }
    </div>
  </nav>
  <p class="header__erreur" role="status">
    @if (erreurDeconnexion()) {
      Déconnexion impossible pour l’instant. Réessaie.
    }
  </p>
</header>
