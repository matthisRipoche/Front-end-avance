name: CI/CD

# - Pull request : tests et build.
# - Push sur main : tests, puis image Docker (GHCR), puis déploiement sur le VPS.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Un seul déploiement à la fois ; les tests d'une branche annulent les précédents
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build

  image:
    name: Construction et publication de l'image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (GHCR exige des minuscules)
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/celeste-next" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement sur le VPS
    needs: image
    # Interrupteur : tant que la variable DEPLOY_ENABLED n'est pas "true", l'image est construite
    # mais rien n'est déployé (voir deploy/README.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Les secrets de cet environnement ne sont lisibles que par ce job.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte du serveur fournie à l'avance : pas de confiance au premier contact
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Envoi de la configuration
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          # Chemin relatif = dans le dossier personnel de l'utilisateur SSH : pas besoin de sudo
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'celeste-next' }}
        run: |
          # Le dossier est créé au premier déploiement : rien à préparer à la main sur le serveur
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$PORT" docker-compose.prod.yml "$USER@$HOST:$DEPLOY_PATH/"

      - name: Mise à jour du conteneur
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'celeste-next' }}
          DOMAIN: ${{ secrets.DOMAIN }}
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Le jeton GitHub (valable le temps du job) passe par stdin : jamais écrit sur le disque
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "set -euo pipefail
             cd '$DEPLOY_PATH'
             docker login ghcr.io -u '$GHCR_USER' --password-stdin
             # Le .env est réécrit à chaque déploiement à partir de GitHub, seule source de vérité.
             # Il mémorise aussi la version déployée : un 'docker compose up' manuel reprendra la même.
             printf 'DOMAIN=%s\nIMAGE=%s\nTAG=%s\n' '$DOMAIN' '$IMAGE' '$TAG' > .env
             docker compose -f docker-compose.prod.yml pull
             docker compose -f docker-compose.prod.yml up -d --remove-orphans
             docker logout ghcr.io
             docker image prune -f"

      - name: Vérification
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/health" || true)
            if [ "$code" = "200" ]; then echo "Site en ligne (HTTP $code)"; exit 0; fi
            echo "tentative $i : HTTP $code"; sleep 5
          done
          echo "Le site ne répond pas après le déploiement" >&2
          exit 1
